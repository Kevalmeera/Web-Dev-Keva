<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style> 
        p{
            font-family:Georgia, 'Times New Roman', Times, serif;
            color:rgb(77, 201, 193);
            font-weight:500;
        }
        .momo{
            font-style: italic;
            color:rgb(244, 234, 169);
            font-family: 'Courier New', Courier, monospace;
        }
        .princess{
            font-style: bold;
            color:rgb(250, 43, 150);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: larger;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color:crimson;"> ini adalah kalimat pertama </p>
    <p> ini adalah kalimat kedua </p>
    <p class="momo"> ini adalah kalimat ketiga </p>
    <p class="princess"> ini adalah kalimat keempat </p>
</body>
</html>
